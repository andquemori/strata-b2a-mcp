# Smithery.ai Configuration for STRATA & TrashPan 2-Story B2A MCP Server
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      mcpApiKey:
        type: string
        description: Optional X-MCP-API-Key for 2nd Floor paid query_* full data execution. Leave blank to use Free 1st Floor tools/list (18 canonical tools; ?profile=full for all 144 callable tools), list_b2a_data_streams ($0), and probe_stream_inventory ($0).
      mcpEndpointUrl:
        type: string
        default: https://strata.andque.com/mcp
        description: STRATA/TrashPan Remote MCP Streamable HTTP endpoint.
  commandFunction:
    |-
    (config) => ({
      command: 'node',
      args: ['index.mjs'],
      env: {
        ...(config.mcpApiKey ? { MCP_API_KEY: config.mcpApiKey } : {}),
        ...(config.mcpEndpointUrl ? { STRATA_MCP_URL: config.mcpEndpointUrl } : {})
      }
    })
